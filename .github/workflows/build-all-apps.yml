name: Build All Aither Nexus Native Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-all-apps.yml"
      - ".github/workflows/build-one-app.yml"
      - ".github/workflows/build-*.yml"
      - "scripts/**"
      - "apps.json"
      - "README.md"

permissions:
  contents: write
  id-token: write

concurrency:
  group: aither-nexus-native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-products:
    name: Build ${{ matrix.app_name }} and publish its own release
    strategy:
      fail-fast: false
      # Process one product at a time to avoid launching dozens of native runners together.
      max-parallel: 1
      matrix:
        include:
          - app_name: AitherCore
            project_path: aithernexus/aithercore
          - app_name: AitherHomeOS
            project_path: aithernexus/aitherhomeos
          - app_name: AitherCloud
            project_path: aithernexus/aithercloud
          - app_name: AitherChat
            project_path: aithernexus/aitherchat
          - app_name: AitherSignIn
            project_path: aithernexus/aithersignin
          - app_name: AitherNexus
            project_path: aithernexus/AitherNexus
          - app_name: AitherWeb
            project_path: aithernexus/AitherWeb
          - app_name: AitherGaming
            project_path: aithernexus/AitherGaming
          - app_name: AitherMail
            project_path: aithernexus/AitherMail
          - app_name: AitherAppDownloads
            project_path: aithernexus/AitherAppDounloads
          - app_name: AitherApps
            project_path: aithernexus/AitherApps
          - app_name: AitherFiles
            project_path: aithernexus/AitherFiles
          - app_name: AitherError404
            project_path: aithernexus/AitherError404
          - app_name: AitherClock
            project_path: aithernexus/AitherClock
          - app_name: AitherAI
            project_path: aithernexus/AitherAI
          - app_name: AitherCalculator
            project_path: aithernexus/AitherCalculator
          - app_name: AitherMaps
            project_path: aithernexus/AitherMaps
          - app_name: AitherDashboard
            project_path: aithernexus/AitherDashboard
          - app_name: AitherNotes
            project_path: aithernexus/AitherNotes
          - app_name: AitherWeather
            project_path: aithernexus/aitherweather
          - app_name: AitherPrivacy
            project_path: aithernexus/privacy
          - app_name: AitherTerms
            project_path: aithernexus/terms
    uses: ./.github/workflows/build-one-app.yml
    with:
      app_name: ${{ matrix.app_name }}
      project_path: ${{ matrix.project_path }}
