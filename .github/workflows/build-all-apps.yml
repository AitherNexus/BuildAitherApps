name: Build All Aither Nexus Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-all-apps.yml"
      - "scripts/**"
      - "apps.json"
      - "README.md"

permissions:
  contents: write
  id-token: write

concurrency:
  group: aither-nexus-app-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build app bundles
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out BuildAitherApps
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust for Tauri desktop apps
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools and desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y zip build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev

      - name: Retrieve GitLab token securely from Aither Backend
        shell: bash
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aither-build-apps")"
          oidc_token="$(jq -er '.value' <<< "$oidc_response")"
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $oidc_token" \
            "https://aitherbackend.onrender.com/api/build/gitlab-token")"
          gitlab_token="$(jq -er '.token' <<< "$token_response")"
          if [[ -z "$gitlab_token" ]]; then
            echo "Aither Backend returned an empty GitLab token." >&2
            exit 1
          fi
          echo "::add-mask::$gitlab_token"
          printf 'GITLAB_TOKEN=%s\\n' "$gitlab_token" >> "$GITHUB_ENV"

      - name: Build every Aither Nexus project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_COMMIT: ${{ github.sha }}
        run: bash scripts/build-all.sh

      - name: Upload complete build files
        uses: actions/upload-artifact@v4
        with:
          name: aither-nexus-all-apps-${{ github.run_number }}
          path: |
            release-files/
            BUILD-REPORT.md
            apps.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish downloadable app bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="aither-apps-build-${BUILD_NUMBER}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating its app downloads."
            gh release upload "$tag" release-files/*/*.zip \
              --repo "$GH_REPO" \
              --clobber
            gh release edit "$tag" \
              --repo "$GH_REPO" \
              --title "Aither Nexus Apps — Build #${BUILD_NUMBER}" \
              --notes-file BUILD-REPORT.md
          else
            gh release create "$tag" release-files/*/*.zip \
              --repo "$GH_REPO" \
              --title "Aither Nexus Apps — Build #${BUILD_NUMBER}" \
              --notes-file BUILD-REPORT.md
          fi
